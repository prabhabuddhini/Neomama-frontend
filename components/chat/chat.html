<div id="chatWidget" class="chat-widget">
    <button class="chat-fab" id="chatFab">
        <span class="fab-icon">AI</span>
    </button>

    <div class="chat-panel" id="chatPanel">
        <div class="chat-panel-header">
            <div class="chat-title-row">
                <div class="chat-avatar-sm">N</div>
                <div>
                    <h4>NeoMama AI</h4>
                    <span class="chat-status" id="chatStatusDot">Connecting...</span>
                </div>
            </div>
            <button class="chat-close" id="chatClose">x</button>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="chat-msg bot">
                <div class="msg-bubble">Hello! I'm your NeoMama AI clinical assistant. Ask me about any patient, baby, vaccination status, or clinic statistics.</div>
            </div>
        </div>

        <div class="chat-input-bar">
            <input type="text" id="chatInput" placeholder="Ask about a patient or clinic data..." autocomplete="off">
            <button id="chatSendBtn" class="chat-send">Send</button>
        </div>
    </div>
</div>
