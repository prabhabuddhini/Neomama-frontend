<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoMama - Contact Us</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Navbar & Footer CSS -->
    <link rel="stylesheet" href="../components/navbar/navbar.css">
    <link rel="stylesheet" href="../components/footer/footer.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/preloader.css">
</head>
<body>
    <div id="nm-preloader">
      <div class="preloader-content">
        <div id="lottie-container"></div>
        <div class="preloader-text">NeoMama is preparing</div>
      </div>
    </div>


    <!-- Navbar -->
    <div id="navbar"></div>

    <section class="container mt-5 pt-5">
        <h3 class="section-title text-center">Contact Us</h3>
        <p class="section-text text-center">Have questions about NeoMama? Get in touch with us.</p>

        <div class="row mt-5">
            <div class="col-md-7 mb-4">
                <div class="info-card">
                    <h3>Send Us a Message</h3>
                    <form id="contactForm">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="name" class="form-control" placeholder="Enter your full name">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" placeholder="Enter your email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Subject</label>
                            <input type="text" id="subject" class="form-control" placeholder="Enter subject">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea id="message" class="form-control" rows="5" placeholder="Write your message"></textarea>
                        </div>
                        <button type="submit" class="btn btn-main">Submit</button>
                    </form>
                </div>
            </div>

            <div class="col-md-4 mb-4 offset-md-1">
                <div class="info-card contact-details-box">
                    <h3>Contact Details</h3>
                    <p><strong>Email:</strong> info@neomama.com</p>
                    <p><strong>Phone:</strong> +94 71 234 5678</p>
                    <p><strong>Address:</strong> Colombo, Sri Lanka</p>

                    <div class="social-icons mt-4">
                        <span title="Facebook">📘</span>
                        <span title="Email">✉️</span>
                        <span title="Phone">📞</span>
                        <span title="Location">📍</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <div id="footer"></div>

    <script src="../js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/components-loader.js"></script>
</body>
</html>
