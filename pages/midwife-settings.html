<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoMama | Midwife Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../components/sidebar/sidebar.css">
    <link rel="stylesheet" href="../css/ai-alerts.css"> <!-- We reuse the premium card and header styles from ai-alerts -->
    <style>
        .settings-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1.5px solid #e2e8f0; font-size: 13px; font-family: 'Poppins', sans-serif; transition: 0.2s; }
        .form-group input:focus, .form-group select:focus { border-color: #2c7da0; outline: none; }
        .btn-save { padding: 10px 24px; border: none; border-radius: 10px; background: linear-gradient(135deg, #1b4965, #2c7da0); color: white; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-save:hover { opacity: 0.9; }
        .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="dashboard">
    <div id="sidebar"></div>

    <div class="main-content">

        <!-- Page header -->
        <div class="page-header-bar">
            <div>
                <h2>My Profile</h2>
                <p>Manage your personal midwife account settings</p>
            </div>
        </div>

        <div class="settings-grid">
            <!-- Personal Info -->
            <div class="card">
                <div class="section-header">
                    <div class="section-icon blue">P</div>
                    <h4>Personal Information</h4>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="mwName" placeholder="Your name">
                </div>
                <div class="form-group">
                    <label>Email (Login)</label>
                    <input type="email" id="mwEmail" disabled style="background:#f1f5f9;">
                    <small style="color: #64748b; font-size: 11px;">Email cannot be changed directly. Contact your doctor to change.</small>
                </div>
                <div class="form-group">
                    <label>Position</label>
                    <input type="text" id="mwPosition" disabled style="background:#f1f5f9;">
                </div>
                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="text" id="mwPhone" placeholder="+94...">
                </div>
                <div class="form-group" style="margin-top: 20px;">
                    <button class="btn-save" id="saveProfileBtn">Update Profile</button>
                </div>
            </div>

            <!-- Security -->
            <div class="card">
                <div class="section-header">
                    <div class="section-icon red">S</div>
                    <h4>Security</h4>
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="mwPassword" placeholder="Leave blank to keep current password">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="mwPasswordConfirm" placeholder="Re-type new password">
                </div>
                <div class="form-group" style="margin-top: 20px;">
                    <button class="btn-save" id="updateSecurityBtn">Update Password</button>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="../js/auth-guard.js"></script>
<script src="../js/components-loader.js"></script>
<script src="../js/midwife-settings.js"></script>

</body>
</html>
